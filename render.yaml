services:
  # Backend API Web Service
  - type: web
    name: reception-ai-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true

  # Frontend Web Client (Static Site on CDN - No plan field)
  - type: web
    name: reception-ai-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://reception-ai-backend-djdq.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reception-ai-backend-djdq.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
