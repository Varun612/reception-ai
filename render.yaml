services:
  # Backend API Service
  - type: web
    name: reception-ai-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        fromService:
          type: web
          name: reception-ai-frontend
          property: host
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true

  # Frontend Web Client
  - type: web
    name: reception-ai-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reception-ai-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
